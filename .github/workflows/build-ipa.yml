name: Construire le .ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Restriction

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'app (sans signature)
        run: |
          xcodebuild \
            -project Restriction.xcodeproj \
            -scheme Restriction \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Creer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Restriction.app Payload/
          zip -qry Restriction.ipa Payload
          ls -lh Restriction.ipa

      - name: Mettre le .ipa en telechargement (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Restriction-ipa
          path: Restriction/Restriction.ipa

      - name: Publier le .ipa dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Restriction - build ${{ github.run_number }}
          body: "Telecharge Restriction.ipa ci-dessous puis installe-le avec Sideloadly."
          files: Restriction/Restriction.ipa
