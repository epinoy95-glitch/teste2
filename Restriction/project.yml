name: Restriction
options:
  bundleIdPrefix: com.restriction
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Restriction:
    type: application
    platform: iOS
    sources:
      - path: Restriction
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restriction.app
        PRODUCT_NAME: Restriction
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Restriction
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pour ajouter tes photos de progression (elles restent sur ton téléphone)."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
